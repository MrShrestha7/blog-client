name: Blog CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog?schema=public
      JWT_SECRET: ci-secret
      PASSWORD: 123
      CI: true
      E2E: true

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db db:push
      - run: pnpm turbo build
      - run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @repo/web test
      - run: pnpm --filter @repo/web check-types
      - run: pnpm --filter @repo/admin check-types
      - run: pnpm --filter @repo/playwright exec playwright install --with-deps chromium
      - run: pnpm --filter @repo/playwright test-1
      - run: pnpm --filter @repo/playwright test-2
      - run: pnpm --filter @repo/playwright test-3
